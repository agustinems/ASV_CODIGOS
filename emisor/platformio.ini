[platformio]
default_envs = emisor
data_dir = control-web/dist-esp32

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:emisor]
upload_speed = 115200
board_build.partitions = partitions_esp32_local.csv
board_build.filesystem = littlefs
lib_deps =
  links2004/WebSockets
  bblanchon/ArduinoJson
  sandeepmistry/LoRa@^0.8.0
